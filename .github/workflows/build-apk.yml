name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write # to publish the APK as a release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Uses the LIVEMIC_KEYSTORE_B64 repository secret if you add one (so new builds install as
      # updates); otherwise makes a throwaway key, and you uninstall the old app before updating.
      - name: Build APK
        env:
          KEYSTORE_B64: ${{ secrets.LIVEMIC_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.LIVEMIC_KEYSTORE_PASSWORD }}
        run: |
          export LIVEMIC_KEYSTORE="$RUNNER_TEMP/livemic.jks"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$LIVEMIC_KEYSTORE"
            export LIVEMIC_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD"
          else
            export LIVEMIC_KEYSTORE_PASSWORD="$(openssl rand -hex 16)"
            keytool -genkeypair -keystore "$LIVEMIC_KEYSTORE" -alias livemic \
              -storepass "$LIVEMIC_KEYSTORE_PASSWORD" -keypass "$LIVEMIC_KEYSTORE_PASSWORD" \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Live Mic"
          fi
          gradle assembleRelease
          cp app/build/outputs/apk/release/app-release.apk LiveMic.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LiveMic-apk
          path: LiveMic.apk

      # Each build on main becomes the newest release, so this link always gets the latest APK:
      # https://github.com/<owner>/<repo>/releases/latest/download/LiveMic.apk
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Live Mic build ${{ github.run_number }}
          files: LiveMic.apk
